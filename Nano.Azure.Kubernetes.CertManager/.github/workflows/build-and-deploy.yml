name: Build and Deploy
on:
  push
env:
  APP_NAME: cert-manager
  VERSION: '${{ vars.VERSION }}.${{ github.run_number }}.${{ github.run_attempt }}'
  CHART_VERSION: v1.20.2
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }} 
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }} 
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }} 
  AZURE_GROUP_KUBERNETES: ${{ vars.AZURE_RESOURCE_GROUP_KUBERNETES }}
  AZURE_GROUP_DNS: ${{ vars.AZURE_RESOURCE_GROUP_DNS }}
  AZURE_SUBSCRIPTION_ID: ${{ github.ref == 'refs/heads/master' && secrets.PRODUCTION_AZURE_SUBSCRIPTION_ID || secrets.STAGING_AZURE_SUBSCRIPTION_ID }}
  KUBERNETES_CLUSTER: ${{ github.ref == 'refs/heads/master' && vars.PRODUCTION_KUBERNETES_CLUSTER || vars.STAGING_KUBERNETES_CLUSTER }}
  KUBERNETES_NODEPOOL_COMPUTE: cpu
  KUBERNETES_NAMESPACE: apps
  KUBERNETES_REPLICA_COUNT: 2
  KUBERNETES_MEMORY_REQUEST: 128Mi
  KUBERNETES_MEMORY_LIMIT: 384Mi
  KUBERNETES_CPU_REQUEST: 50m
  KUBERNETES_CPU_LIMIT: 150m
  LETS_ENCRYPT_EMAIL: ${{ secrets.LETS_ENCRYPT_EMAIL }}
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: ${{ github.repository }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        shell: pwsh
        run: |
          az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET --tenant $env:AZURE_TENANT_ID -o none;
          az account set -s $env:AZURE_SUBSCRIPTION_ID -o none;
          az aks get-credentials -g $env:AZURE_GROUP_KUBERNETES -n $env:KUBERNETES_CLUSTER -o none;
          
      - name: Deploy Cert-Manager
        shell: pwsh
        run: |
          Get-Content .kubernetes/certmanager-values.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/certmanager-values.tmp.yaml;

          $command = @"
              set -eu

              helm upgrade --install $env:APP_NAME oci://quay.io/jetstack/charts/cert-manager --atomic --namespace $env:KUBERNETES_NAMESPACE --version $env:CHART_VERSION -f certmanager-values.tmp.yaml || exit 1

              kubectl apply -f certmanager-cluster-issuer.tmp.yaml || exit 2
          "@;

          $result = az aks command invoke `
              -g $env:AZURE_GROUP_KUBERNETES `
              -n $env:KUBERNETES_CLUSTER `
              --file .kubernetes/certmanager-values.tmp.yaml `
              --command $command `
              --output json | ConvertFrom-Json;

          echo $result

          if ($result.exitCode -ne 0)
          {
              throw "Deploy Cert-Manager Failed"
          }

      - name: Deploy Cluster Issuer (Dynamic)
        shell: pwsh
        run: |
          $zones = az network dns zone list -g $env:AZURE_GROUP_DNS | ConvertFrom-Json;

          $solvers = foreach ($zone in $zones) {
              $clientId = az identity list -g $env:AZURE_GROUP_DNS --query "[?contains(name, '$($zone.name)')].clientId | [0]" -o tsv;

              @{
                  selector = @{
                    dnsZones = @($zone.name)
                  }
                  dns01 = @{
                    azureDNS = @{
                      subscriptionID    = $env:AZURE_SUBSCRIPTION_ID
                      resourceGroupName = $env:AZURE_GROUP_DNS
                      hostedZoneName    = $zone.name
                      environment       = AzurePublicCloud
                      managedIdentity   = @{
                        clientID = $env:DNS_ZONE_CLIENT_ID
                      }
                    }
                  }
              }
          };

          $env:CLUSTER_ISSUER_SOLVERS = $solvers | ConvertTo-Json -Depth 20 -Compress;

          Get-Content .kubernetes/certmanager-cluster-issuer.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/certmanager-cluster-issuer.tmp.yaml;

          $command = @"
              set -eu

              kubectl apply -f certmanager-cluster-issuer.tmp.yaml || exit 1
          "@;

          $result = az aks command invoke `
              -g $env:AZURE_GROUP_KUBERNETES `
              -n $env:KUBERNETES_CLUSTER `
              --file .kubernetes/certmanager-cluster-issuer.tmp.yaml `
              --command $command `
              --output json | ConvertFrom-Json;

          echo $result;

          if ($result.exitCode -ne 0)
          {
              throw "Deploy Cluster Issuer Failed"
          }

      - name: Create DNS Zone Credentials
        shell: pwsh
        run: |
          $env:APP_NAME_IDENTITY = az identity list --resource-group $env:AZURE_GROUP_DNS --query [0].name -o tsv;
          $env:APP_NAME_IDENTITY_CREDENTIAL = $env:APP_NAME_IDENTITY + "-certmanager";
          $env:KUBERNETES_ISSUER_URL = az aks list -g $env:AZURE_GROUP_KUBERNETES --query [0].[oidcIssuerProfile.issuerUrl] -o tsv;
          $env:SUBJECT = "system:serviceaccount:" + $env:KUBERNETES_NAMESPACE + ":cert-manager";

          $existing = az identity federated-credential list `
              -g $env:AZURE_GROUP_DNS `
              --identity-name $env:APP_NAME_IDENTITY `
              --query "[?issuer=='$env:KUBERNETES_ISSUER_URL' && subject=='$env:SUBJECT'] | [0].name" -o tsv;

          if (-not $existing) 
          {
              az identity federated-credential create `
                  -g $env:AZURE_GROUP_DNS `
                  -n $env:APP_NAME_IDENTITY_CREDENTIAL `
                  --identity-name $env:APP_NAME_IDENTITY `
                  --issuer $env:KUBERNETES_ISSUER_URL `
                  --subject $env:SUBJECT;

              if ($LastExitCode -ne 0)
              { 
                  throw "Create DNS Zone Credentials Failed";
              }
          }

      - name: GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            Version: ${{ env.VERSION }}
            Commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: Slack Notification
        if: always()
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          config: .github/config/slack.yml
          status: ${{ job.status }}
          channel: ${{ vars.SLACK_CHANNEL }}