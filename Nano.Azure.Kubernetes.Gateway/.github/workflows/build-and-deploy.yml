name: Build and Deploy
on:
  push
env:
  APP_NAME: public-gateway
  VERSION: '${{ vars.VERSION }}.${{ github.run_number }}.${{ github.run_attempt }}'
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }} 
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }} 
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }} 
  AZURE_GROUP: ${{ vars.AZURE_KUBERNETES_RESOURCE_GROUP }} 
  AZURE_SUBSCRIPTION_ID: ${{ github.ref == 'refs/heads/master' && secrets.PRODUCTION_AZURE_SUBSCRIPTION_ID || secrets.STAGING_AZURE_SUBSCRIPTION_ID }}
  KUBERNETES_CLUSTER: ${{ github.ref == 'refs/heads/master' && vars.PRODUCTION_KUBERNETES_CLUSTER || vars.STAGING_KUBERNETES_CLUSTER }}
  KUBERNETES_NODEPOOL_COMPUTE: cpu
  KUBERNETES_NAMESPACE: apps
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: ${{ github.repository }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        shell: pwsh
        run: |
          az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET --tenant $env:AZURE_TENANT_ID -o none;
          az account set -s $env:AZURE_SUBSCRIPTION_ID -o none;
          az aks get-credentials -g $env:AZURE_GROUP -n $env:KUBERNETES_CLUSTER -o none;

      - name: Deploy
        shell: pwsh
        run: |
          $env:DNS_ZONE_NAME = az network dns zone list -g $env:AZURE_RESOURCE_GROUP --query [0].name -o tsv;

          Get-Content .kubernetes/gateway.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/gateway.tmp.yaml;
          Get-Content .kubernetes/blackhole-service.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/blackhole-service.tmp.yaml;
          Get-Content .kubernetes/blackhole-deployment.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/blackhole-deployment.tmp.yaml;
          Get-Content .kubernetes/blackhole-httproute-catch-all.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/blackhole-httproute-catch-all.tmp.yaml;

          $command = @"
              set -eu

              kubectl apply -f gateway.tmp.yaml || exit 1
              kubectl apply -f blackhole-service.tmp.yaml || exit 2
              kubectl apply -f blackhole-deployment.tmp.yaml || exit 3
              kubectl apply -f blackhole-httproute-catch-all.tmp.yaml || exit 4
          "@;

          $result = az aks command invoke `
              -g $env:AZURE_GROUP `
              -n $env:KUBERNETES_CLUSTER `
              --file .kubernetes/gateway.tmp.yaml `
              --file .kubernetes/blackhole-service.tmp.yaml `
              --file .kubernetes/blackhole-deployment.tmp.yaml `
              --file .kubernetes/blackhole-httproute-catch-all.tmp.yaml `
              --command $command `
              --output json | ConvertFrom-Json;

          echo $result

          if ($result.exitCode -ne 0)
          {
              throw "Deploy failed"
          }

      - name: GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            Version: ${{ env.VERSION }}
            Commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: Slack Notification
        if: always()
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          config: .github/config/slack.yml
          status: ${{ job.status }}
          channel: ${{ vars.SLACK_CHANNEL }}
