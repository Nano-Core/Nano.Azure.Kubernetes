name: Build and Deploy
on:
  schedule:
    - cron: "*/50 * * * *"
  pull_request:
    branches:
      - master 
  push:
    branches:
      - master 
env:
  APP_NAME: ghcr-pull-secret
  VERSION: '${{ vars.VERSION }}.${{ github.run_number }}.${{ github.run_attempt }}'
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }} 
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }} 
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }} 
  AZURE_GROUP_KUBERNETES: ${{ vars.AZURE_RESOURCE_GROUP_KUBERNETES }} 
  KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
  CONTAINER_REGISTRY_HOST: ghcr.io
  GITHUBRUNNER_APP_ID: ${{ secrets.GITHUBRUNNER_APP_ID }}
  GITHUBRUNNER_PRIVATE_KEY: ${{ secrets.GITHUBRUNNER_PRIVATE_KEY }}
  GITHUBRUNNER_INSTALLATION_ID: ${{ secrets.GITHUBRUNNER_INSTALLATION_ID }}
jobs:
  build-and-deploy:
    runs-on:
      - self-hosted
      - linux 
      - ${{ github.ref == 'refs/heads/master' && 'Production' || 'Staging' }}
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: ${{ github.repository }}-${{ matrix.environment }}
      cancel-in-progress: true
    strategy:
      matrix:
        environment:
          - Staging
          - Production
    env:
      AZURE_SUBSCRIPTION_ID: ${{ matrix.environment == 'Production' && secrets.PRODUCTION_AZURE_SUBSCRIPTION_ID || secrets.STAGING_AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        if: matrix.environment == 'Staging' || github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET --tenant $env:AZURE_TENANT_ID -o none;
          az account set -s $env:AZURE_SUBSCRIPTION_ID -o none;

          $env:KUBERNETES_CLUSTER = az aks list -g $env:AZURE_GROUP_KUBERNETES --query [0].name -o tsv;
          az aks get-credentials -g $env:AZURE_GROUP_KUBERNETES -n $env:KUBERNETES_CLUSTER -o none;

      - name: Refresh GHCR Pull Secrets
        if: matrix.environment == 'Staging' || github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          $h = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{"alg":"RS256","typ":"JWT"}')).TrimEnd('=').Replace('+','-').Replace('/','_');
          $p = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("{`"iat`":$now,`"exp`":$($now+600),`"iss`":$env:GITHUBRUNNER_APP_ID}")).TrimEnd('=').Replace('+','-').Replace('/','_');

          $rsa = [Security.Cryptography.RSA]::Create();
          $rsa.ImportFromPem($env:GITHUBRUNNER_PRIVATE_KEY);

          $sig=[Convert]::ToBase64String(
            $rsa.SignData(
              [Text.Encoding]::UTF8.GetBytes("$h.$p"),
              [Security.Cryptography.HashAlgorithmName]::SHA256,
              [Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
          ).TrimEnd('=').Replace('+','-').Replace('/','_');

          $jwt="$h.$p.$sig";

          $token = Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/app/installations/$env:GITHUBRUNNER_INSTALLATION_ID/access_tokens" `
            -Headers @{
              Authorization = "Bearer $jwt"
              Accept = "application/vnd.github+json"
              "User-Agent" = "gh-app-auth"
            } | Select-Object -ExpandProperty token;

          kubectl create secret docker-registry $env:APP_NAME `
            -n $env:KUBERNETES_NAMESPACE `
            --docker-server=$env:CONTAINER_REGISTRY_HOST `
            --docker-username="x-access-token" `
            --docker-password=$token `
            --dry-run=client -o yaml | kubectl apply -f -;

          if ($LastExitCode -ne 0) 
          { 
              throw "error";
          }

      - name: GitHub Release
        if: matrix.environment == 'Staging' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ env.VERSION }}-${{ matrix.environment }}"
          name: "Release ${{ env.VERSION }} (${{ matrix.environment }})"
          body: |
            Version: ${{ env.VERSION }}
            Commit: ${{ github.sha }}
            Build run: ${{ github.run_number }}
            Environment: ${{ matrix.environment }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          
      - name: Slack Notification
        if: always()
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          config: .github/config/slack.yml
          status: ${{ job.status }}
          channel: ${{ vars.SLACK_CHANNEL }}