name: Build and Deploy
on:
  push
env:
  APP_NAME: redis-cluster
  HELM_VERSION: 3.7
  CHART_VERSION: 9.1.3
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }} 
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }} 
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }} 
  AZURE_GROUP: ${{ vars.AZURE_KUBERNETES_RESOURCE_GROUP }} 
  KUBERNETES_NODEPOOL_COMPUTE: cpu
  KUBERNETES_NAMESPACE: default
  KUBERNETES_REPLICA_COUNT: 6
  KUBERNETES_MEMORY_REQUEST: 512Mi
  KUBERNETES_MEMORY_LIMIT: 1572Mi
  KUBERNETES_CPU_REQUEST: 100m
  KUBERNETES_CPU_LIMIT: 300m
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.repository }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Set Environmental Variables
        id: set-variables
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -eq 'refs/heads/master') {
              echo "AZURE_SUBSCRIPTION_ID=${{ secrets.PRODUCTION_AZURE_SUBSCRIPTION_ID }}" >> $env:GITHUB_ENV;
              echo "KUBERNETES_CLUSTER=${{ vars.PRODUCTION_KUBERNETES_CLUSTER }}" >> $env:GITHUB_ENV;
              echo "REDIS_ADMIN_PASSWORD=${{ secrets.PRODUCTION_REDIS_ADMIN_PASSWORD }}" >> $env:GITHUB_ENV;
          }
          else {
              echo "AZURE_SUBSCRIPTION_ID=${{ secrets.STAGING_AZURE_SUBSCRIPTION_ID }}" >> $env:GITHUB_ENV;
              echo "KUBERNETES_CLUSTER=${{ vars.STAGING_KUBERNETES_CLUSTER }}" >> $env:GITHUB_ENV;
              echo "REDIS_ADMIN_PASSWORD=${{ secrets.STAGING_REDIS_ADMIN_PASSWORD }}" >> $env:GITHUB_ENV;
          }

      - name: Deploy
        shell: pwsh
        run: |
          sudo az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET --tenant $env:AZURE_TENANT_ID -o none;
          sudo az account set -s $env:AZURE_SUBSCRIPTION_ID -o none;
          sudo az aks get-credentials -g $env:AZURE_GROUP -n $env:KUBERNETES_CLUSTER -o none;

          sudo apt-get update -y;
          sudo apt-get install snapd --yes;
          sudo snap install helm --channel=$env:HELM_VERSION --classic;
          sudo helm repo add bitnami https://charts.bitnami.com/bitnami;
          sudo helm repo update;

          $parameters = @(
              "--version", $env:CHART_VERSION,
              "--namespace", $env:KUBERNETES_NAMESPACE,
              "--set", "cluster.nodes=$env:KUBERNETES_REPLICA_COUNT",
              "--set", "metrics.enabled=true",
              "--set", "password=$env:REDIS_ADMIN_PASSWORD",
              "--set", "containerSecurityContext.enabled=true",
              "--set", "containerSecurityContext.privileged=false",
              "--set", "containerSecurityContext.allowPrivilegeEscalation=false",
              "--set", "podSecurityContext.enabled=true",
              "--set", "redis.podAntiAffinityPreset=soft",
              "--set", "redis.resources.requests.cpu=$env:KUBERNETES_CPU_REQUEST",
              "--set", "redis.resources.requests.memory=$env:KUBERNETES_MEMORY_REQUEST",
              "--set", "redis.resources.limits.cpu=$env:KUBERNETES_CPU_LIMIT",
              "--set", "redis.resources.limits.memory=$env:KUBERNETES_MEMORY_LIMIT",
              "--set", "master.nodeSelector.kubernetes\.io\/os=linux",
              "--set", "master.nodeSelector.nodepool\.compute=$env:KUBERNETES_NODEPOOL_COMPUTE",
              "--set", "replica.nodeSelector.kubernetes\.io\/os=linux",
              "--set", "replica.nodeSelector.nodepool\.compute=$env:KUBERNETES_NODEPOOL_COMPUTE";

          $exists = sudo helm list --filter $env:APP_NAME --namespace $env:KUBERNETES_NAMESPACE;
          if ($exists.count -gt 1) {
              sudo helm upgrade $env:APP_NAME bitnami/redis-cluster $parameters;
          }
          else {    
              sudo helm install $env:APP_NAME bitnami/redis-cluster $parameters;
          }

      - name: Slack Notification
        if: always()
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          config: .github/config/slack.yml
          status: ${{ job.status }}
          channel: ${{ vars.SLACK_CHANNEL }}